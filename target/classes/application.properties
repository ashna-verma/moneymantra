#MySql config
spring.datasource.url= jdbc:mysql://localhost:3306/moneymantra
spring.datasource.username= root
spring.datasource.password= password

#Context path
server.servlet.context-path= /api/v1.0

#JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql= true

#Email config
brevo.api.key=${BREVO_API_KEY}
spring.mail.properties.mail.smtp.from= ${BREVO_FROM_EMAIL}

#JWT secret key
jwt.secret=${JWT_SECRET}

money.mantra.frontend.url = ${MONEY_MANTRA_FRONTEND_URL}

#AI insights api key
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

app.activation.url= ${MONEY_MANTRA_BACKEND_URL}
#Activating Prod profile
spring.profiles.active= prod